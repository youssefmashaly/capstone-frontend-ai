<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .help {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .checkbox-group {
      display: grid;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger-zone {
      border: 1px solid #fecaca;
      background: #fff1f2;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <form>
      <div class="card">
        <h2 class="section-title">Profile</h2>

        <div class="row">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Jane" />
          </div>

          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Doe" />
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" />
        </div>

        <div class="field">
          <label for="timezone">Timezone</label>
          <select id="timezone" name="timezone">
            <option value="utc">UTC</option>
            <option value="est">Eastern Time</option>
            <option value="cst">Central Time</option>
            <option value="mst">Mountain Time</option>
            <option value="pst">Pacific Time</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Notifications</h2>

        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" name="emailNotifications" checked />
            Email notifications
          </label>

          <label class="checkbox-item">
            <input type="checkbox" name="pushNotifications" />
            Push notifications
          </label>

          <label class="checkbox-item">
            <input type="checkbox" name="weeklyDigest" checked />
            Weekly digest
          </label>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Privacy</h2>

        <div class="field">
          <label for="visibility">Profile visibility</label>
          <select id="visibility" name="visibility">
            <option value="public">Public</option>
            <option value="private">Private</option>
            <option value="friends">Friends only</option>
          </select>
        </div>

        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" placeholder="Tell others about yourself..."></textarea>
          <div class="help">This will appear on your public profile if visibility is set to public.</div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Password</h2>

        <div class="field">
          <label for="currentPassword">Current password</label>
          <input type="password" id="currentPassword" name="currentPassword" />
        </div>

        <div class="row">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" />
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" />
          </div>
        </div>
      </div>

      <div class="card danger-zone">
        <h2 class="section-title">Danger zone</h2>
        <p class="help">These actions are permanent. Proceed with caution.</p>
        <div class="actions" style="justify-content: space-between;">
          <button type="button" class="btn-danger">Delete account</button>
          <button type="button" class="btn-secondary">Export data</button>
        </div>
      </div>

      <div class="actions">
        <button type="reset" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</body>
</html>
